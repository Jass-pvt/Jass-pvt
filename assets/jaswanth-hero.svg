<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-labelledby="jr-hero-title jr-hero-desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="jr-hero-title">Jaswanth Rathore</title>
  <desc id="jr-hero-desc">Software Engineer, Full-Stack Developer, DevOps and Cloud Engineer, AI/ML Engineer. Dark violet banner with a technical grid, orbital geometry and a gold underline.</desc>

  <defs>
    <linearGradient id="jr-hero-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#09090D"/>
      <stop offset="0.55" stop-color="#170F2B"/>
      <stop offset="1" stop-color="#2D1757"/>
    </linearGradient>
    <radialGradient id="jr-hero-glow-a" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="jr-hero-glow-b" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5426A8" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#5426A8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="jr-hero-gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D6B56D" stop-opacity="0"/>
      <stop offset="0.12" stop-color="#D6B56D"/>
      <stop offset="0.85" stop-color="#D6B56D"/>
      <stop offset="1" stop-color="#D6B56D" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="jr-hero-trail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5426A8" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#F5F3F7"/>
    </linearGradient>
    <pattern id="jr-hero-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#8B5CF6" stroke-opacity="0.13" stroke-width="1"/>
    </pattern>
    <radialGradient id="jr-hero-fade" cx="0.62" cy="0.45" r="0.75">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.08"/>
    </radialGradient>
    <mask id="jr-hero-grid-mask">
      <rect width="1200" height="380" fill="url(#jr-hero-fade)"/>
    </mask>
    <clipPath id="jr-hero-clip">
      <rect width="1200" height="380" rx="18"/>
    </clipPath>
    <path id="jr-hero-orbit-path" d="M 950 190 m -150 0 a 150 150 0 1 1 300 0 a 150 150 0 1 1 -300 0"/>
    <path id="jr-hero-orbit-path-2" d="M 950 190 m -96 0 a 96 96 0 1 0 192 0 a 96 96 0 1 0 -192 0"/>
  </defs>

  <g clip-path="url(#jr-hero-clip)">
    <rect width="1200" height="380" fill="url(#jr-hero-bg)"/>

    <!-- moving violet light -->
    <ellipse cx="900" cy="150" rx="360" ry="220" fill="url(#jr-hero-glow-b)">
      <animate attributeName="cx" values="900;980;900" dur="16s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="260" cy="330" rx="320" ry="150" fill="url(#jr-hero-glow-a)">
      <animate attributeName="cx" values="260;420;260" dur="20s" repeatCount="indefinite"/>
    </ellipse>

    <!-- technical grid -->
    <rect width="1200" height="380" fill="url(#jr-hero-grid)" mask="url(#jr-hero-grid-mask)"/>

    <!-- orbital geometry -->
    <g fill="none" stroke="#8B5CF6">
      <circle cx="950" cy="190" r="150" stroke-opacity="0.45" stroke-dasharray="2 7"/>
      <circle cx="950" cy="190" r="96" stroke="#5426A8" stroke-opacity="0.9"/>
      <ellipse cx="950" cy="190" rx="150" ry="52" stroke-opacity="0.35" transform="rotate(-24 950 190)"/>
      <path d="M 950 40 V 340 M 800 190 H 1100" stroke="#A1A1AA" stroke-opacity="0.18"/>
      <polygon points="950,128 1003,159 1003,221 950,252 897,221 897,159" stroke="#D6B56D" stroke-opacity="0.55"/>
    </g>
    <circle cx="950" cy="190" r="4" fill="#D6B56D"/>
    <circle r="5" fill="#F5F3F7">
      <animateMotion dur="14s" repeatCount="indefinite"><mpath xlink:href="#jr-hero-orbit-path"/></animateMotion>
    </circle>
    <circle r="3.5" fill="#8B5CF6">
      <animateMotion dur="9s" repeatCount="indefinite"><mpath xlink:href="#jr-hero-orbit-path-2"/></animateMotion>
    </circle>

    <!-- light trail -->
    <path d="M -20 332 C 220 332 300 300 520 312 S 860 350 1220 318" fill="none" stroke="#5426A8" stroke-opacity="0.5" stroke-width="1.5"/>
    <path d="M -20 332 C 220 332 300 300 520 312 S 860 350 1220 318" fill="none" stroke="url(#jr-hero-trail)" stroke-width="2.5" stroke-linecap="round" pathLength="100" stroke-dasharray="14 86" stroke-dashoffset="-8">
      <animate attributeName="stroke-dashoffset" values="14;-100" dur="7s" repeatCount="indefinite"/>
    </path>

    <!-- text -->
    <text x="72" y="92" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="17" letter-spacing="3" fill="#A1A1AA">JASS-PVT  /  ENGINEERING PORTFOLIO</text>
    <text x="70" y="178" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="76" font-weight="700" letter-spacing="-1" fill="#F5F3F7">Jaswanth Rathore</text>

    <!-- gold underline (soft halo + crisp line) -->
    <rect x="72" y="202" width="560" height="7" rx="3.5" fill="url(#jr-hero-gold)" opacity="0.22"/>
    <rect x="72" y="204" width="560" height="3" rx="1.5" fill="url(#jr-hero-gold)">
      <animate attributeName="width" values="0;560;560" keyTimes="0;0.2;1" dur="9s" begin="0s" repeatCount="indefinite" calcMode="linear"/>
    </rect>

    <text x="72" y="258" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="28" fill="#F5F3F7">Software Engineer <tspan fill="#D6B56D">/</tspan> Full-Stack <tspan fill="#D6B56D">/</tspan> DevOps &amp; Cloud <tspan fill="#D6B56D">/</tspan> AI-ML</text>
    <text x="72" y="296" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="17" fill="#A1A1AA">B.E. Computer Science &amp; Engineering  ·  Chennai, India</text>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="379" rx="17.5" fill="none" stroke="#5426A8" stroke-opacity="0.7"/>
</svg>
