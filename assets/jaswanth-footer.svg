<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 110" width="1200" height="110" role="img" aria-labelledby="jr-foot-title" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="jr-foot-title">Jaswanth Rathore (Jass-pvt)</title>
  <defs>
    <linearGradient id="jr-foot-bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#09090D"/>
      <stop offset="0.5" stop-color="#170F2B"/>
      <stop offset="1" stop-color="#09090D"/>
    </linearGradient>
    <linearGradient id="jr-foot-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5426A8" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#5426A8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="jr-foot-gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D6B56D" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#D6B56D"/>
      <stop offset="1" stop-color="#D6B56D" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="jr-foot-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="jr-foot-clip"><rect width="1200" height="110" rx="14"/></clipPath>
  </defs>
  <g clip-path="url(#jr-foot-clip)">
    <rect width="1200" height="110" fill="url(#jr-foot-bg)"/>
    <ellipse cx="300" cy="60" rx="260" ry="70" fill="url(#jr-foot-glow)">
      <animate attributeName="cx" values="300;900;300" dur="22s" repeatCount="indefinite"/>
    </ellipse>
    <path d="M 0 70 C 200 40 320 90 600 62 S 1000 36 1200 66" fill="none" stroke="#5426A8" stroke-opacity="0.45" stroke-width="1.2"/>
    <path d="M 0 70 C 200 40 320 90 600 62 S 1000 36 1200 66" fill="none" stroke="url(#jr-foot-line)" stroke-width="2" pathLength="100" stroke-dasharray="18 82" stroke-dashoffset="-40" stroke-linecap="round">
      <animate attributeName="stroke-dashoffset" values="18;-100" dur="9s" repeatCount="indefinite"/>
    </path>
    <rect x="450" y="84" width="300" height="2" rx="1" fill="url(#jr-foot-gold)"/>
    <text x="600" y="38" text-anchor="middle" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="15" letter-spacing="3" fill="#A1A1AA">JASWANTH RATHORE  ·  JASS-PVT</text>
