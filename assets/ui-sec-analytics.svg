<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 96" width="900" height="96" role="img" aria-label="GitHub Analytics"><title>GitHub Analytics</title>
<defs>
  <linearGradient id="acc" x1="0" x2="1" y1="0" y2="0">
    <stop offset="0" stop-color="#6d28d9"/><stop offset=".55" stop-color="#a855f7"/><stop offset="1" stop-color="#c084fc"/>
  </linearGradient>
  <linearGradient id="bgp" x1="0" x2="0" y1="0" y2="1">
    <stop offset="0" stop-color="#1b1033"/><stop offset="1" stop-color="#0b0716"/>
  </linearGradient>
  <linearGradient id="gold" x1="0" x2="1" y1="0" y2="1">
    <stop offset="0" stop-color="#e9d5ff"/><stop offset="1" stop-color="#c084fc"/>
  </linearGradient>
  <linearGradient id="shim" x1="0" x2="1" y1="0" y2="0">
    <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="glow" cx="0" cy=".5" r="1">
    <stop offset="0" stop-color="#6d28d9" stop-opacity=".42"/><stop offset="1" stop-color="#6d28d9" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="glow2" cx="1" cy="0" r="1">
    <stop offset="0" stop-color="#a855f7" stop-opacity=".22"/><stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
  </radialGradient>
  <pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse">
    <circle cx="1.5" cy="1.5" r="1" fill="#ffffff" opacity=".07"/>
  </pattern>
</defs><rect x=".5" y=".5" width="899" height="95" rx="16" fill="url(#bgp)" stroke="#2f2150" stroke-width="1"/><rect x=".5" y=".5" width="899" height="95" rx="16" fill="url(#dots)"/><rect width="900" height="96" rx="16" fill="url(#glow)"/><circle cx="30" cy="24" r="4.5" fill="#8b5cf6" opacity=".9"/><circle cx="46" cy="24" r="4.5" fill="#c084fc" opacity=".9"/><circle cx="62" cy="24" r="4.5" fill="#a855f7" opacity=".9"/><text x="870" y="29" text-anchor="end" font-family="'SF Mono','Fira Code',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="13" fill="#9a8fb5">~/metrics</text><rect x="30" y="44" width="5" height="38" rx="2.5" fill="url(#acc)"/><text x="50" y="79" font-family="Georgia,'Times New Roman','DejaVu Serif',serif" font-size="38" font-weight="700" fill="#f3eefc">GitHub Analytics</text><text x="870" y="79" text-anchor="end" font-family="'SF Mono','Fira Code',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="13" fill="#c4b8e0">live activity dashboard</text><clipPath id="c-analytics"><rect x="18" y="88" width="864" height="3" rx="1.5"/></clipPath><g clip-path="url(#c-analytics)"><rect x="18" y="88" width="864" height="3" fill="url(#acc)"/><rect x="-160" y="88" width="160" height="3" fill="url(#shim)" opacity=".9"><animate attributeName="x" from="-160" to="900" dur="4.5s" repeatCount="indefinite"/></rect></g></svg>